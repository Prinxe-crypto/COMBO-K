name: Trigger Kalshi Daemon via API

on:
  repository_dispatch:
    types: [run-kalshi-daemon]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Execute Daemon
        run: python daemon.py

      - name: Commit & Push Updated CSV Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_flexible_paper_log.csv || true
          git commit -m "chore: update paper trading log [skip ci]" || echo "No changes to commit"
          git push
